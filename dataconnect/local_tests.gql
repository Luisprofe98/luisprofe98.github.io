# LOCAL QUERY 12 - Demo form and universal fields
query LocalQuery12DemoForm {
  forms(where: { clubId: { eq: "11111111-1111-4111-8111-111111111111" } }) {
    id
    name
    formType
    status
    publicSlug
    formFields_on_form(orderBy: [{ position: ASC }]) {
      name
      fieldType
      required
      position
    }
  }
}

# LOCAL QUERY 13 - Rival form isolation
query LocalQuery13RivalForm {
  forms(where: { clubId: { eq: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa" } }) {
    id
    name
    formType
    status
  }
}

# LOCAL QUERY 14 - Destination entities
query LocalQuery14FormTargets {
  clubAssociates(where: { clubId: { eq: "11111111-1111-4111-8111-111111111111" } }) {
    id firstName lastName nationalId birthDate
  }
  tournamentEntries(where: { clubId: { eq: "11111111-1111-4111-8111-111111111111" } }) {
    id firstName lastName category
  }
  eventAttendees(where: { clubId: { eq: "11111111-1111-4111-8111-111111111111" } }) {
    id firstName lastName organization
  }
  volunteers(where: { clubId: { eq: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa" } }) {
    id firstName lastName availability
  }
}

# LOCAL QUERY 15 - Public inscription persisted with internal tenant keys
query LocalQuery15PublicInscription {
  inscriptions(where: { formId: { eq: "10000000-0000-4000-8000-000000000015" } }) {
    id
    clubId
    formId
    status
    submittedData
    submittedAt
  }
}
