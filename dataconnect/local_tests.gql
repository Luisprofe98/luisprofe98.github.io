# LOCAL QUERY TESTS ONLY
# DO NOT USE AS PRODUCTION CONNECTOR

# LOCAL QUERY 01 - Club
query LocalQuery01Club {
  club(id: "11111111-1111-4111-8111-111111111111") {
    id
    name
    status
  }
}

# LOCAL QUERY 02 - Club + Seasons
query LocalQuery02ClubSeasons {
  club(id: "11111111-1111-4111-8111-111111111111") {
    id
    name
    seasons_on_club {
      id
      name
      startDate
      endDate
      status
    }
  }
}

# LOCAL QUERY 03 - User
query LocalQuery03User {
  users(where: { firebaseUid: { eq: "local-test-firebase-uid" } }) {
    id
    firebaseUid
    email
    name
    systemRole
    status
  }
}

# LOCAL QUERY 04 - Membership
query LocalQuery04Membership {
  users(where: { firebaseUid: { eq: "local-test-firebase-uid" } }) {
    id
    name
    clubMembers_on_user(
      where: { clubId: { eq: "11111111-1111-4111-8111-111111111111" } }
    ) {
      role
      status
      club {
        id
        name
        status
      }
    }
  }
}

# LOCAL QUERY 05 - Player
query LocalQuery05Player {
  players(
    where: {
      id: { eq: "44444444-4444-4444-8444-444444444444" }
      clubId: { eq: "11111111-1111-4111-8111-111111111111" }
    }
  ) {
    id
    firstName
    lastName
    club {
      id
      name
    }
  }
}

